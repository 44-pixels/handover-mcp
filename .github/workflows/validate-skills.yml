name: Validate Agent Skills

on:
  pull_request:
    paths:
      - "llms-install.md"
      - "scripts/verify-cline-marketplace.mjs"
      - "skills/**"
      - "templates/handover-skill/**"
      - "tests/**"
      - ".github/workflows/validate-skills.yml"
  push:
    branches:
      - main
    paths:
      - "llms-install.md"
      - "scripts/verify-cline-marketplace.mjs"
      - "skills/**"
      - "templates/handover-skill/**"
      - "tests/**"
      - ".github/workflows/validate-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test integration contracts
        run: node --test tests/*.test.mjs
      - name: Validate every published skill
        run: |
          for skill in skills/*/SKILL.md; do
            node templates/handover-skill/validate.mjs "$skill"
          done
      - name: Verify the production MCP discovery boundary
        run: node scripts/verify-cline-marketplace.mjs
