name: Publish Handover CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use a trusted-publishing compatible npm CLI
        run: npm install --global "npm@^11.5.1"

      - name: Verify package
        run: |
          npm test --prefix cli
          npm pack --dry-run ./cli
          test "$(node -p "require('./cli/package.json').repository.url")" = \
            "git+https://github.com/44-pixels/handover-mcp.git"

      - name: Publish package
        run: npm publish ./cli --access public --provenance
