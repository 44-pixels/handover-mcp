name: Publish MCP Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - server.json
      - .github/workflows/publish-registry.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download verified MCP publisher
        env:
          RELEASE: v1.8.0
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${RELEASE}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output checksums.txt \
            "https://github.com/modelcontextprotocol/registry/releases/download/${RELEASE}/registry_1.8.0_checksums.txt"
          grep 'mcp-publisher_linux_amd64.tar.gz$' checksums.txt | sha256sum --check
          tar -xzf mcp-publisher.tar.gz

      - name: Validate registry manifest
        run: ./mcp-publisher validate server.json

      - name: Publish remote server
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          test -n "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher login http \
            --domain handover.sh \
            --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher publish server.json
